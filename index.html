<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组织行为学 · 练习题库</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236b56a0'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23ffffff' font-family='serif'%3E%E7%BB%84%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#f3eef9; --paper2:#ffffff; --ink:#1f1a29; --ink2:#4b4357;
  --muted:#877d9c; --line:#e0d7ee; --line2:#f0eaf8;
  --zhu:#6b56a0; --zhu-l:#8f7bc4; --qing:#5c6c99; --gold:#a184c9;
  --ok:#4a7a5f; --no:#a34a6c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--ink);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#f7f3fc 0%,#f1ebfa 100%);
  background-attachment:fixed}
body{display:flex;min-height:100vh}

/* ── 左侧目录 ── */
.side{width:236px;flex:0 0 236px;border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f2ecfa 0%,#ece5f7 100%);
  backdrop-filter:blur(6px)}
.side-hd{padding:26px 22px 18px;border-bottom:1px solid var(--line2)}
.side-hd h1{font-family:"Songti SC","SimSun",serif;font-size:19px;font-weight:600;letter-spacing:.06em}
.side-hd .sub{font-size:11.5px;color:var(--muted);letter-spacing:.12em;margin-top:5px}
.side-nav{overflow-y:auto;flex:1;padding:8px 0 30px}
.nav-it{padding:9px 22px;font-size:13.5px;color:var(--ink2);cursor:pointer;
  display:flex;justify-content:space-between;align-items:baseline;border-left:2px solid transparent;
  transition:.15s}
.nav-it:hover{background:rgba(0,0,0,.025);color:var(--ink)}
.nav-it.on{border-left-color:var(--zhu);color:var(--zhu);background:rgba(107,86,160,.07);font-weight:600}
.nav-it[data-m="__wrong__"]{border-top:1px solid var(--line2);margin-top:4px;padding-top:10px}
.nav-it[data-m="__wrong__"] .n{color:var(--no)}
.nav-it[data-m="__wrong__"].on{border-left-color:var(--no);color:var(--no);background:rgba(163,74,108,.08)}
.nav-it .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-it.on .n{color:var(--zhu-l)}
.side-ft{padding:14px 22px;border-top:1px solid var(--line2);font-size:11px;color:var(--muted);line-height:1.9}
.side-note{margin-top:7px;font-size:10px;line-height:1.7;color:var(--muted);opacity:.75}
.prog{height:3px;background:var(--line2);border-radius:2px;margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--zhu),var(--gold));transition:width .35s ease}

/* ── 主区 ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(245,240,252,.93);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 44px 10px}
.top-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top-row.sub{margin-top:9px;gap:10px}
.tools{flex:0 0 auto;display:flex;gap:6px;align-items:center;margin-left:12px}
.tools .btn{border-color:transparent;background:transparent;color:var(--muted);
  padding:4px 9px;font-size:11.5px}
.tools .btn:hover{background:var(--paper2);border-color:var(--line);color:var(--ink);box-shadow:none}
.tools .btn.on{background:var(--zhu);border-color:var(--zhu);color:#fff}
.search{flex:1;min-width:150px;max-width:330px;position:relative}
.search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--line);
  background:var(--paper2);border-radius:2px;font-size:12.5px;color:var(--ink);outline:none;
  font-family:inherit;transition:.15s}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:9px;top:8px;opacity:.4}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--paper2)}
.seg button{padding:5px 10px;font-size:12px;background:none;border:none;cursor:pointer;
  color:var(--ink2);font-family:inherit;border-right:1px solid var(--line2);transition:.15s}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button:hover:not(.on){background:rgba(0,0,0,.04)}
.btn{padding:5px 11px;font-size:12px;border:1px solid var(--line);background:var(--paper2);
  cursor:pointer;border-radius:2px;font-family:inherit;color:var(--ink2);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--ink)}
.btn.on{background:var(--zhu);border-color:var(--zhu);color:#fff}
.hint{font-size:11.5px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums;
  padding:3px 10px;border-radius:11px;background:rgba(107,86,160,.07);white-space:nowrap}

/* 章节锚点条 */
.anchors{display:flex;gap:6px;overflow-x:auto;flex:1 1 0%;min-width:0;
  scrollbar-width:none;padding:1px 0}
.anchors::-webkit-scrollbar{display:none}
.anchor{font-size:11.5px;padding:3px 10px;border:1px solid transparent;border-radius:11px;
  cursor:pointer;white-space:nowrap;color:var(--ink2);background:transparent;transition:.15s;
  letter-spacing:.02em}
.anchor:hover{background:rgba(107,86,160,.09);color:var(--zhu)}
.anchor.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}

/* ── 内容 ── */
.wrap{padding:34px 44px 110px;max-width:1040px}

/* ── 单题（刷题）模式 ── */
body.single .wrap{flex:1;max-width:none;padding:0;display:flex;
  min-height:calc(100vh - 86px)}
.stage{width:100%;max-width:clamp(680px,70vw,980px);margin:auto;padding:30px 48px 56px}
.q.single{padding:28px 40px 26px;border-left-width:2px;
  box-shadow:0 12px 40px rgba(107,86,160,.13)}
.q.single .q-body{font-size:21px;line-height:2.05;margin-bottom:22px;letter-spacing:.01em}
.q.single .q-hd{margin-bottom:18px;gap:11px;padding-bottom:13px;
  border-bottom:1px solid var(--line)}
.q.single .q-hd .tag{font-size:12px;padding:2px 9px}
.q.single .q-no{font-size:12.5px;font-weight:600;color:var(--ink2);
  padding:1px 7px;border-radius:2px;background:rgba(107,86,160,.08)}
.q.single .src{font-size:12.5px}
.q.single .opts{gap:8px}
.q.single .opt{font-size:17.5px;padding:12px 16px;gap:14px;line-height:1.85}
.q.single .opt .k{flex:0 0 28px;width:28px;height:28px;font-size:13.5px;margin-top:3px}
.q.single .ans{font-size:16px;margin-top:20px;padding-top:18px}
.q.single .ans .lab{font-size:12.5px}
.q.single .ans .val{font-size:17px}
.q.single .ans .exp{font-size:15px;line-height:1.8;color:var(--ink2)}
.q.single .ans .row+.row{margin-top:6px}
.navbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:24px}
.navbar button{padding:10px 26px;font-size:14px;border:1px solid var(--line);
  background:var(--paper2);border-radius:3px;cursor:pointer;font-family:inherit;
  color:var(--ink2);transition:.15s;letter-spacing:.03em}
.navbar button:hover:not(:disabled){border-color:var(--gold);color:var(--zhu);
  box-shadow:0 3px 12px rgba(107,86,160,.15)}
.navbar button:disabled{opacity:.3;cursor:not-allowed}
.navbar .pos{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:104px;text-align:center;background:rgba(255,255,255,.72);
  border:1px solid var(--line2);border-radius:3px;padding:7px 14px;letter-spacing:.04em}
.navbar .pos b{color:var(--ink);font-weight:600;font-size:16px;letter-spacing:0}
.navbar .pos em{font-style:normal;opacity:.6}
.mod-hd{margin:8px 0 22px;padding:0 0 13px 16px;border-bottom:1px solid var(--line);
  position:relative;display:flex;align-items:center;gap:12px}
.mod-hd::before{content:"";position:absolute;left:0;top:3px;bottom:14px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,var(--zhu),var(--gold) 70%,rgba(161,132,201,0))}
.mod-hd .idx{font-family:Georgia,serif;font-size:11px;color:var(--zhu);letter-spacing:.12em;
  border:1px solid var(--line);padding:1px 6px;border-radius:1px;background:rgba(255,255,255,.6)}
.mod-hd h2{font-family:"Songti SC","SimSun",serif;font-size:23px;font-weight:600;letter-spacing:.04em}
.mod-hd .meta{font-size:12px;color:var(--muted);margin-left:auto;margin-right:6px}

.unit-hd{margin:24px 0 10px;display:flex;align-items:center;gap:9px}
.unit-hd .bar{width:3px;height:13px;background:var(--gold)}
.unit-hd h3{font-size:14px;font-weight:600;letter-spacing:.03em;color:var(--ink)}
.unit-hd .cnt{font-size:11px;color:var(--muted)}

.kp-hd{margin:14px 0 6px;font-size:12.5px;color:#5a6b94;
  font-family:"Songti SC",serif;letter-spacing:.05em}
.kp-hd::before{content:"◆";font-size:7px;margin-right:6px;vertical-align:2px;opacity:.7}

.q{background:var(--paper2);border:1px solid var(--line2);border-left:2px solid #ddd2ee;
  padding:14px 18px 13px;margin-bottom:11px;transition:.2s;
  box-shadow:0 1px 3px rgba(107,86,160,.05)}
.q:hover{border-left-color:var(--gold);box-shadow:0 3px 12px rgba(107,86,160,.1)}
.q.right{border-left-color:var(--ok)}
.q.wrong{border-left-color:var(--no)}
.q-hd{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.peek{margin-left:0;font-size:11px;color:var(--ink2);cursor:pointer;letter-spacing:.04em;
  background:rgba(255,255,255,.9);border:1px solid var(--line);font-family:inherit;padding:1px 8px;
  border-radius:2px;transition:.15s;white-space:nowrap}
.peek:hover{color:var(--zhu);border-color:var(--gold);background:rgba(161,132,201,.09)}
.tag{font-size:10.5px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);
  letter-spacing:.06em;border-radius:1px;white-space:nowrap}
.tag.t1{color:#5f6f9c;border-color:#cdd4e8}
.tag.t2{color:#8a6bb0;border-color:#ddd0ee}
.tag.t14{color:#7a5f9e;border-color:#d9cbee}
.tag.t3,.tag.t15{color:#8a6b9e;border-color:#e0d0e6}
.q-no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-body{font-size:14.5px;line-height:1.85;color:var(--ink)}
.opts{margin-top:9px;display:flex;flex-direction:column;gap:3px}
.opt{display:flex;gap:9px;padding:5px 9px;cursor:pointer;border-radius:2px;
  font-size:14px;line-height:1.7;transition:.12s;border:1px solid transparent}
.opt:hover{background:rgba(107,86,160,.06)}
.opt .k{flex:0 0 20px;height:20px;border:1px solid #d3c8e6;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);
  margin-top:2px;font-family:Georgia,serif;transition:.12s;background:#fff}
.opt.sel{background:rgba(111,91,158,.08);border-color:#d8cee9}
.opt.sel .k{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.opt.ok{background:rgba(74,122,95,.12);border-color:#bcd4c4}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:rgba(168,80,110,.07);border-color:#e6c7d2}
.opt.no .k{background:var(--no);color:#fff;border-color:var(--no)}
.ans{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:13px;display:none;line-height:1.85}
.ans.show{display:block}
.ans .row{margin-bottom:3px}
.ans .lab{color:var(--muted);font-size:11.5px;letter-spacing:.08em;margin-right:6px}
.ans .val{color:var(--zhu);font-weight:600;font-family:Georgia,serif;letter-spacing:.04em}
.ans .exp{color:var(--ink2);font-size:13px}
.src{font-size:11px;color:var(--muted);opacity:.7;margin-left:auto}

.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:13.5px}
.totop{position:fixed;right:26px;bottom:26px;width:36px;height:36px;border:1px solid var(--line);
  background:var(--paper2);cursor:pointer;display:none;align-items:center;justify-content:center;
  color:var(--ink2);font-size:14px;border-radius:2px}
.totop:hover{border-color:var(--gold);color:var(--zhu)}
/* ── 平板 / 手机 ── */
@media(max-width:900px){
  .side{display:none}
  .top{padding:9px 12px 8px}
  .top-row{gap:6px}
  .top-row.sub{margin-top:7px;gap:6px}
  .wrap{padding:18px 14px 80px;max-width:none}
  body.single .wrap{min-height:auto;padding:0}
  .stage{max-width:100%;margin:0 auto;padding:16px 12px 44px}
  .q.single{padding:22px 18px 20px;box-shadow:0 4px 18px rgba(107,86,160,.1)}
  .q.single .q-body{font-size:18.5px;line-height:1.95;margin-bottom:16px}
  .q.single .q-hd{margin-bottom:14px;gap:9px;padding-bottom:11px}
  .q.single .opt{font-size:16.5px;padding:9px 11px;gap:11px}
  .q.single .opt .k{flex:0 0 24px;width:24px;height:24px;font-size:12.5px}
  .q.single .ans{font-size:15.5px;margin-top:14px;padding-top:12px}
  .navbar{gap:10px;margin-top:20px}
  .navbar button{padding:9px 16px;font-size:13.5px;flex:1;max-width:150px}
  .navbar .pos{min-width:72px;font-size:12.5px}
  .search{flex:1 1 100%;max-width:none;order:-1}
  .hint{display:none}
  .seg{flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{padding:4px 8px;font-size:11.5px}
  .btn{padding:4px 8px;font-size:11.5px}
  .anchors{gap:4px}
  .anchor{font-size:11px;padding:2px 8px}
  .tools .btn{padding:4px 8px;font-size:11.5px}
  .totop{right:14px;bottom:14px}
  .mod-hd h2{font-size:20px}
  .mod-hd .idx{font-size:10px}
}

@media(max-width:560px){
  #printBtn,#reset{display:none}
  .top{padding:7px 10px 6px}
  .stage{padding:12px 9px 40px}
  .q.single{padding:19px 14px 17px}
  .q.single .q-body{font-size:17.5px;line-height:1.9}
  .q.single .opt{font-size:16px;padding:8px 9px;gap:10px}
  .q.single .opt .k{flex:0 0 22px;width:22px;height:22px;font-size:12px}
  .q.single .src{display:none}
  .q.single .peek{margin-left:auto}
  .q.single .ans{font-size:15px}
  .navbar{gap:8px;margin-top:16px}
  .navbar button{padding:8px 10px;font-size:13px}
  .navbar .pos{min-width:58px;font-size:12px}
  .navbar .pos b{font-size:14px}
  .q{padding:12px 13px 11px}
  .q-body{font-size:14px}
  .opt{font-size:13.5px}
}

/* ── 使用者 / 弹层 ── */
.who{margin-top:10px;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.7);
  border:1px solid var(--line);border-radius:11px;padding:3px 11px;cursor:pointer;
  font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:.15s}
.who:hover{border-color:var(--gold);color:var(--zhu)}
.who::before{content:"⊿ ";opacity:.55}

.veil{position:fixed;inset:0;z-index:100;background:rgba(31,26,41,.42);
  backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
.veil.on{display:flex}

.wcard{background:var(--paper2);border-radius:4px;padding:38px 40px 30px;width:100%;
  max-width:400px;box-shadow:0 24px 70px rgba(31,26,41,.3);text-align:center}
.wk{font-size:10.5px;letter-spacing:.3em;color:var(--zhu);margin-bottom:10px}
.wcard h2{font-family:"Songti SC",serif;font-size:23px;font-weight:600;letter-spacing:.05em;margin-bottom:12px}
.wcard p{font-size:12.5px;color:var(--muted);line-height:1.85;margin-bottom:22px}
.wcard input{width:100%;padding:11px 14px;border:1px solid var(--line);background:#fff;
  font-size:15px;font-family:inherit;color:var(--ink);outline:none;text-align:center;
  border-radius:2px;margin-bottom:12px}
.wcard input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(161,132,201,.13)}
.wbtn{width:100%;padding:11px;background:var(--zhu);color:#fff;border:none;border-radius:2px;
  font-size:14.5px;font-family:inherit;cursor:pointer;letter-spacing:.06em;transition:.15s}
.wbtn:hover{background:var(--zhu-l)}
.wbtn.ghost{background:none;color:var(--muted);border:1px solid var(--line);margin-top:8px}
.wbtn.ghost:hover{background:rgba(107,86,160,.06);color:var(--ink2)}
.wtip{font-size:10.5px;color:var(--muted);margin-top:12px;opacity:.75}

#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;font-size:13px;padding:9px 20px;border-radius:3px;
  opacity:0;pointer-events:none;transition:.26s;z-index:300;max-width:82vw;
  text-align:center;box-shadow:0 8px 26px rgba(31,26,41,.28)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 报告 ── */
.report .rcard{background:var(--paper2);border-radius:4px;width:100%;max-width:760px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(31,26,41,.32)}
.rhd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:26px 32px 18px;border-bottom:1px solid var(--line)}
.rk{font-size:10.5px;letter-spacing:.3em;color:var(--zhu);margin-bottom:6px}
.rhd h2{font-family:"Songti SC",serif;font-size:22px;font-weight:600;letter-spacing:.04em}
.rhd-r{display:flex;gap:8px;flex-shrink:0}
.rbody{overflow-y:auto;padding:24px 32px 34px}

.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.rstat{background:rgba(107,86,160,.05);border:1px solid var(--line2);border-radius:3px;
  padding:14px 10px;text-align:center}
.rstat b{display:block;font-family:Georgia,serif;font-size:24px;color:var(--zhu);font-weight:600;line-height:1.2}
.rstat span{font-size:11px;color:var(--muted);letter-spacing:.06em}

.rsec{margin-bottom:26px}
.rsec h3{font-size:12.5px;color:var(--ink2);letter-spacing:.1em;margin-bottom:12px;
  padding-left:9px;border-left:2px solid var(--gold)}
.rbar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--zhu),var(--gold));
  border-radius:3px;transition:width .5s}
.rbar-t{font-size:11.5px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}

.rrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.rrow:last-child{border-bottom:none}
.rrow .nm{flex:0 0 132px;font-size:12.5px;color:var(--ink)}
.rrow .rb{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.rrow .rb i{display:block;height:100%;border-radius:3px;background:var(--zhu);opacity:.75}
.rrow .rb i.hi{background:var(--ok)}
.rrow .rb i.mid{background:var(--gold)}
.rrow .rb i.lo{background:var(--no)}
.rrow .vv{flex:0 0 96px;text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.rwrong{font-size:12.5px;line-height:1.9}
.rwrong li{margin-bottom:8px;padding-left:4px;list-style:none}
.rwrong li b{color:var(--no);font-weight:600;margin-right:6px}
.rwrong li em{font-style:normal;color:var(--muted);font-size:11.5px;margin-left:6px}
.rempty{font-size:12.5px;color:var(--muted);padding:14px 0}

@media(max-width:640px){
  .rgrid{grid-template-columns:repeat(2,1fr)}
  .rhd{padding:20px 18px 14px;flex-direction:column;align-items:flex-start;gap:12px}
  .rbody{padding:18px}
  .rrow .nm{flex:0 0 96px;font-size:11.5px}
  .rrow .vv{flex:0 0 78px;font-size:11px}
  .wcard{padding:30px 24px 24px}
}

@media print{
  .veil.on{position:static;background:none;backdrop-filter:none;padding:0}
  .veil .rhd-r{display:none}
  .report .rcard{max-height:none;box-shadow:none;max-width:100%}
  .rbody{overflow:visible;padding:0}
  body.printing-report .side,
  body.printing-report .top,
  body.printing-report .main,
  body.printing-report .totop{display:none!important}
  body.printing-report #welcome{display:none!important}
}

/* ── 打印 / 导出 PDF ── */
@media print{
  @page{margin:14mm 12mm}
  .side,.top,.totop,.peek{display:none!important}
  html,body{background:#fff}
  .main{display:block}
  .wrap{max-width:none;padding:0}
  .q{break-inside:avoid;page-break-inside:avoid;background:#fff;box-shadow:none;
     border:1px solid #ddd;border-left-width:1px;margin-bottom:8px}
  .mod-hd{break-before:page;page-break-before:always}
  .mod-hd:first-child{break-before:auto;page-break-before:auto}
  .ans{display:block!important}
  .ans .exp{color:#333}
}
body.printing .side,body.printing .top{display:none}
body.printing .main{width:100%}
body.printing .wrap{max-width:none;padding:24px 30px 60px}
body.printing .ans{display:block}
body.printing .mod-hd{break-before:page}
body.printing .mod-hd:first-child{break-before:auto}

<body>
<aside class="side">
  <div class="side-hd">
    <h1>组织行为学</h1>
    <div class="sub">2026 秋冬 · 练习题库</div>
    <button class="who" id="who" title="点击切换使用者">—</button>
  </div>
  <nav class="side-nav" id="nav"></nav>
  <div class="side-ft">
    <div id="statAll"></div>
    <div class="prog"><i id="progFill"></i></div>
    <div class="side-note">题干 智慧树课程练习<br>答案 依教材整理</div>
  </div>
</aside>

<div class="main">
  <div class="top">
    <div class="top-row">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="q" placeholder="搜索题干、知识点…">
      </div>
      <div class="seg" id="typeSeg">
        <button class="on" data-t="all">全部</button>
        <button data-t="单选题">单选</button>
        <button data-t="多选题">多选</button>
        <button data-t="判断题">判断</button>
        <button data-t="填空">填空</button>
      </div>
      <span class="hint" id="hint"></span>
      <div class="tools">
        <button class="btn" id="shareBtn" title="生成进度链接，可在另一台设备打开">分享进度</button>
        <button class="btn" id="reportBtn" title="查看个人学习报告">报告</button>
        <button class="btn" id="shuffleBtn" title="打乱做题顺序（每次开启重新洗牌）">随机</button>
        <button class="btn" id="toggleAll" title="全部展开答案">显示答案</button>
        <button class="btn" id="modeBtn" title="切换列表 / 刷题">列表模式</button>
        <button class="btn" id="printBtn" title="打印或另存为 PDF">打印</button>
        <button class="btn" id="reset" title="清空本机作答记录">清空</button>
      </div>
    </div>
    <div class="top-row sub">
      <div class="anchors" id="anchors"></div>
    </div>
  </div>
  <div class="wrap" id="wrap"></div>
</div>

<button class="totop" id="totop">↑</button>

<!-- 首次进入：填写名字 -->
<div class="veil" id="welcome">
  <div class="wcard">
    <div class="wk">组织行为学</div>
    <h2>开始你的练习</h2>
    <p>810 道题 · 11 个模块。答题记录只保存在这台设备上，换人使用时可以随时切换。</p>
    <input id="nameInput" placeholder="输入名字或学号" maxlength="16" autocomplete="off">
    <button class="wbtn" id="startBtn">开始练习</button>
    <div class="wtip">建议填写真实身份，方便对照自己的报告</div>
  </div>
</div>

<!-- 学习报告 -->
<div class="veil report" id="report">
  <div class="rcard">
    <div class="rhd">
      <div>
        <div class="rk">学习报告</div>
        <h2 id="rName">—</h2>
      </div>
      <div class="rhd-r">
        <button class="btn" id="reportPrint">打印报告</button>
        <button class="btn" id="reportClose">关闭</button>
      </div>
    </div>
    <div class="rbody" id="reportBody"></div>
  </div>
</div>

<!-- 分享进度 -->
<div class="veil" id="shareBox">
  <div class="wcard">
    <div class="wk">跨设备接着做</div>
    <h2>进度链接</h2>
    <p>把这条链接发到另一台设备（微信、备忘录都行），<br>在那边打开就自动接上进度。</p>
    <input id="shareInput" readonly onclick="this.select()">
    <button class="wbtn" id="shareCopy">复制链接</button>
    <button class="wbtn ghost" id="shareClose">关闭</button>
    <div class="wtip" id="shareTip">链接里只有对错记录，不含个人信息</div>
  </div>
</div>

const TYPE_CLASS = {"单选题":"t1","多选题":"t2","判断题":"t14"};
let curMod = "all", curType = "all", kw = "", showAll = false;
let done = {};
let curIdx = 0;
let mode = "single";   // single | list
let shuffleOn = false, shuffleKey = "", shuffleOrder = null;
let profile = null;

/* ── 跨设备同步 ── */
const SYNC_URL = "__SYNC_URL__";
let syncCode = localStorage.getItem("ob_sync_code") || "";
let syncDirty = {};
let syncTimer = null;
let pendingHash = false;

function hashKey(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Math.abs(h).toString(36);
}
function pkey(){ return profile ? profile.key : "_guest"; }
function loadDone(){
  try { done = JSON.parse(localStorage.getItem("ob_done_" + pkey()) || "{}"); }
  catch(e){ done = {}; }
  if(!done || typeof done !== "object") done = {};
}
function saveDone(){
  localStorage.setItem("ob_done_" + pkey(), JSON.stringify(done));
}

const MODULES = [];
DATA.forEach(q => { if(!MODULES.includes(q.module)) MODULES.push(q.module); });

function typeCls(t){
  for(const k in TYPE_CLASS) if((t||"").includes(k)) return TYPE_CLASS[k];
  return "t3";
}
function isMulti(t){ return (t||"").includes("多选"); }
function showAnswer(t){
  return (t||"").includes("多选") ? "多选" : (t||"").includes("判断") ? "判断"
       : (t||"").includes("填空") ? "填空" : "单选";
}
function letterOf(i){ return "ABCDEFG"[i]; }

function getList(){
  let list = DATA.filter(q=>{
    if(curMod === "__wrong__"){
      if(done[q.id] !== 0) return false;
    } else if(curMod !== "all" && q.module !== curMod) return false;
    if(curType !== "all" && !(q.type||"").includes(curType)) return false;
    if(kw){
      const s = (q.content||"") + (q.kp||"") + (q.unit||"") + (q.options||[]).map(o=>o.v).join("");
      if(!s.includes(kw)) return false;
    }
    return true;
  });

  // 随机顺序：只在刷题模式生效，同一筛选范围内顺序固定
  if(shuffleOn && mode === "single"){
    const key = curMod + "|" + curType + "|" + kw;
    if(key !== shuffleKey || !shuffleOrder){
      shuffleOrder = list.map(q=>q.id);
      for(let i = shuffleOrder.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = shuffleOrder[i]; shuffleOrder[i] = shuffleOrder[j]; shuffleOrder[j] = t;
      }
      shuffleKey = key;
    }
    const pos = {};
    shuffleOrder.forEach((id, i)=>{ pos[id] = i; });
    list = list.slice().sort((a,b)=>(pos[a.id] ?? 1e9) - (pos[b.id] ?? 1e9));
  }
  return list;
}

function wrongIds(){
  return Object.keys(done).filter(id => done[id] === 0 && DATA.some(q=>q.id===id));
}

function renderNav(){
  const nav = document.getElementById("nav");
  let h = `<div class="nav-it ${curMod==='all'?'on':''}" data-m="all">
      <span>全部题目</span><span class="n">${DATA.length}</span></div>`;
  h += `<div class="nav-it ${curMod==='__wrong__'?'on':''}" data-m="__wrong__">
      <span>错题本</span><span class="n" id="wrongCount">${wrongIds().length}</span></div>`;
  MODULES.forEach(m=>{
    const c = DATA.filter(q=>q.module===m).length;
    h += `<div class="nav-it ${curMod===m?'on':''}" data-m="${m}">
      <span>${m}</span><span class="n">${c}</span></div>`;
  });
  nav.innerHTML = h;
  nav.querySelectorAll(".nav-it").forEach(el=>{
    el.onclick = ()=>{ curMod = el.dataset.m; curIdx = 0; render(); };
  });
}

function optsHTML(q){
  return (q.options||[]).map((o,oi)=>{
    const L = letterOf(oi);
    return `<div class="opt" data-i="${oi}" data-l="${L}">
      <span class="k">${L}</span><span class="v">${o.v}</span></div>`;
  }).join("");
}

function cardHTML(q, idx, single){
  const oks = optsHTML(q);
  const srcTxt = single ? `${q.module} · ${q.kp}` : (q.src || "");
  return `<div class="q${single?" single":""}" data-id="${q.id}" data-ans="${q.answer||''}">
    <div class="q-hd">
      <span class="tag ${typeCls(q.type)}">${showAnswer(q.type)}</span>
      <span class="q-no">${q.seq || (idx+1)}</span>
      <span class="src">${srcTxt}</span>
      <button class="peek">${showAll?'收起':'看答案'}</button>
    </div>
    <div class="q-body">${q.content}</div>
    ${oks?`<div class="opts">${oks}</div>`:""}
    <div class="ans ${showAll?'show':''}">
      <div class="row"><span class="lab">答案</span><span class="val">${q.answer||"待补"}</span></div>
      ${q.analysis?`<div class="row"><span class="lab">解析</span><span class="exp">${q.analysis}</span></div>`:""}
    </div>
  </div>`;
}

function bindCard(card, list){
  const ans = card.querySelector(".ans");
  const peek = card.querySelector(".peek");
  peek.onclick = ()=>{
    ans.classList.toggle("show");
    peek.textContent = ans.classList.contains("show") ? "收起" : "看答案";
  };
  const answer = (card.dataset.ans || "").trim();
  card.querySelectorAll(".opt").forEach(op=>{
    op.onclick = ()=>{
      if(!answer) return;
      const multi = isMulti(card.querySelector(".tag").textContent) || /[、,，]/.test(answer);

      card.classList.remove("right","wrong");
      card.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","no"));

      if(multi){
        op.classList.toggle("sel");
      } else {
        card.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
        op.classList.add("sel");
      }

      const chosen = [...card.querySelectorAll(".opt.sel")].map(x=>x.dataset.l).sort().join("");
      const right = (answer.match(/[A-G]/g) || []).join("").split("").sort().join("");
      if(!right) return;
      if(chosen.length >= right.length){
        card.querySelectorAll(".opt").forEach(x=>{
          const l = x.dataset.l;
          if(right.includes(l)) x.classList.add("ok");
          if(chosen.includes(l) && !right.includes(l)) x.classList.add("no");
        });
        card.classList.add(chosen === right ? "right" : "wrong");
        ans.classList.add("show");
        peek.textContent = "收起";
        done[card.dataset.id] = chosen === right ? 1 : 0;
        saveDone();
        syncDirty[card.dataset.id] = done[card.dataset.id];
        queueSync();
        updateHint(list);
        // 错题本里答对了，自动把这道题移出
        if(chosen === right && curMod === "__wrong__"){
          setTimeout(()=>{ render(); }, 900);
        }
      }
    };
  });
}

function renderSingle(list){
  const wrap = document.getElementById("wrap");
  document.body.classList.add("single");
  if(curIdx >= list.length) curIdx = list.length - 1;
  if(curIdx < 0) curIdx = 0;
  const q = list[curIdx];
  wrap.innerHTML = `<div class="stage">
      ${cardHTML(q, curIdx, true)}
      <div class="navbar">
        <button id="prevBtn" ${curIdx===0?"disabled":""}>← 上一题</button>
        <span class="pos"><b>${curIdx+1}</b><em> / ${list.length}</em></span>
        <button id="nextBtn" ${curIdx===list.length-1?"disabled":""}>下一题 →</button>
      </div>
    </div>`;
  bindCard(wrap.querySelector(".q"), list);
  const go = d=>{
    const ni = Math.min(Math.max(curIdx + d, 0), list.length - 1);
    if(ni === curIdx) return;
    curIdx = ni; render(); window.scrollTo({top:0});
  };
  const pb = document.getElementById("prevBtn"), nb = document.getElementById("nextBtn");
  if(pb) pb.onclick = ()=> go(-1);
  if(nb) nb.onclick = ()=> go(1);
  renderAnchorsSingle(q);
}

function renderList(list){
  const wrap = document.getElementById("wrap");
  document.body.classList.remove("single");
  let html = "", lastMod = null, lastUnit = null, lastKp = null, mi = 0;
  list.forEach((q, i)=>{
    if(q.module !== lastMod){
      mi = MODULES.indexOf(q.module) + 1;
      html += `<div class="mod-hd" data-mod="${q.module}">
        <span class="idx">${String(mi).padStart(2,"0")}</span>
        <h2>${q.module}</h2>
        <span class="meta">${DATA.filter(x=>x.module===q.module).length} 题</span>
      </div>`;
      lastMod = q.module; lastUnit = null; lastKp = null;
    }
    if(q.unit !== lastUnit){
      html += `<div class="unit-hd"><div class="bar"></div><h3>${q.unit}</h3>
        <span class="cnt">${DATA.filter(x=>x.unit===q.unit).length} 题</span></div>`;
      lastUnit = q.unit; lastKp = null;
    }
    if(q.kp !== lastKp){
      html += `<div class="kp-hd">${q.kp}</div>`;
      lastKp = q.kp;
    }
    html += cardHTML(q, i, false);
  });
  wrap.innerHTML = html;
  renderAnchors(list);
  wrap.querySelectorAll(".q").forEach(card=>bindCard(card, list));
}

function render(){
  renderNav();
  const list = getList();
  const wrap = document.getElementById("wrap");
  if(!list.length){
    if(mode === "single") document.body.classList.add("single");
    else document.body.classList.remove("single");
    const msg = (curMod === "__wrong__")
      ? `错题本是空的。<div style="font-size:12.5px;opacity:.7;margin-top:6px">做错的题会自动收进来，重做答对后自动移出。</div>`
      : `没有匹配的题目，换个关键词试试。`;
    wrap.innerHTML = `<div class="empty">${msg}</div>`;
    renderAnchorsSingle(null);
    updateHint(list);
    return;
  }
  if(mode === "single") renderSingle(list);
  else renderList(list);
  updateHint(list);
}

function renderAnchors(list){
  const bar = document.getElementById("anchors");
  const mods = [];
  (list||[]).forEach(q=>{ if(!mods.includes(q.module)) mods.push(q.module); });
  bar.innerHTML = mods.map(m=>{
    const n = (list||[]).filter(q=>q.module===m).length;
    return `<span class="anchor" data-m="${m}">${m} <em style="opacity:.55;font-style:normal">${n}</em></span>`;
  }).join("");
  bar.querySelectorAll(".anchor").forEach(a=>{
    a.onclick = ()=>{
      const el = [...document.querySelectorAll(".mod-hd")].find(x=>x.dataset.mod===a.dataset.m);
      if(el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 105, behavior:"smooth"});
    };
  });
  observeMods();
}

function renderAnchorsSingle(cur){
  const bar = document.getElementById("anchors");
  const activeMod = (cur && curMod !== "__wrong__") ? cur.module : null;
  bar.innerHTML = MODULES.map(m=>{
    const n = DATA.filter(q=>q.module===m).length;
    return `<span class="anchor ${m===activeMod?'on':''}" data-m="${m}">${m} <em style="opacity:.55;font-style:normal">${n}</em></span>`;
  }).join("");
  bar.querySelectorAll(".anchor").forEach(a=>{
    a.onclick = ()=>{ curMod = a.dataset.m; curIdx = 0; render(); };
  });
  if(modObs){ modObs.disconnect(); modObs = null; }
}

let modObs = null;
function observeMods(){
  if(modObs) modObs.disconnect();
  const hs = document.querySelectorAll(".mod-hd");
  if(!hs.length) return;
  modObs = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        document.querySelectorAll(".anchor").forEach(a=>
          a.classList.toggle("on", a.dataset.m === en.target.dataset.mod));
      }
    });
  }, {rootMargin: "-100px 0px -70% 0px", threshold: 0});
  hs.forEach(h=>modObs.observe(h));
}

function updateHint(list){
  const ids = (list||[]).map(q=>q.id);
  const d = ids.filter(i=>done[i]!==undefined).length;
  const r = ids.filter(i=>done[i]===1).length;
  document.getElementById("hint").textContent =
    `${list?list.length:DATA.length} 题 · 已做 ${d} · 正确 ${r}` + (d?` (${Math.round(r/d*100)}%)`:"");
  const nDone = Object.keys(done).length;
  const pct = DATA.length ? (nDone / DATA.length * 100) : 0;
  document.getElementById("statAll").textContent =
    `已做 ${nDone} / ${DATA.length}` + (nDone ? ` · ${pct.toFixed(1)}%` : "");
  const fill = document.getElementById("progFill");
  if(fill) fill.style.width = (nDone ? Math.max(pct, 0.8) : 0) + "%";
  const wc = document.getElementById("wrongCount");
  if(wc) wc.textContent = wrongIds().length;
}

/* ── 同步 ── */
function setSyncState(msg){
  const b = document.getElementById("syncBtn");
  if(!b) return;
  b.classList.toggle("on", !!syncCode);
  b.title = msg || (syncCode ? "同步码：" + syncCode : "跨设备同步");
}

function queueSync(){
  if(!SYNC_URL || !syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncPush, 1500);
}

async function syncPush(force){
  if(!SYNC_URL || !syncCode) return;
  const ids = Object.keys(force ? done : syncDirty);
  if(!ids.length) return;
  const payload = {};
  ids.forEach(id => { payload[id] = done[id]; });
  try{
    const r = await fetch(`${SYNC_URL}?k=${encodeURIComponent(syncCode)}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({items: payload})
    });
    const j = await r.json();
    if(j && j.items){
      Object.keys(j.items).forEach(id => { done[id] = j.items[id]; });
      saveDone();
      syncDirty = {};
      updateHint(getList());
      setSyncState("已同步 · " + Object.keys(j.items).length + " 题");
    }
  }catch(e){
    setSyncState("同步失败，稍后重试");
  }
}

async function syncPull(){
  if(!SYNC_URL || !syncCode) return;
  try{
    const r = await fetch(`${SYNC_URL}?k=${encodeURIComponent(syncCode)}`);
    const j = await r.json();
    if(j && j.items){
      const n = Object.keys(j.items).length;
      Object.keys(j.items).forEach(id => { done[id] = j.items[id]; });
      saveDone();
      render();
      setSyncState(n ? `已拉取 ${n} 题` : "同步码已就绪");
    }
  }catch(e){
    setSyncState("连接失败，检查网络");
  }
}

/* ── 进度链接：每题 2 bit，810 题约 203 字节 ── */
function encodeState(){
  const bytes = [];
  let cur = 0, cnt = 0;
  DATA.forEach(q=>{
    const v = done[q.id] === 1 ? 1 : done[q.id] === 0 ? 2 : 0;
    cur = (cur << 2) | v;
    cnt += 2;
    if(cnt === 8){ bytes.push(cur); cur = 0; cnt = 0; }
  });
  if(cnt) bytes.push(cur << (8 - cnt));
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeState(code){
  try{
    let s = code.replace(/-/g, "+").replace(/_/g, "/");
    while(s.length % 4) s += "=";
    const bin = atob(s);
    const out = [];
    for(let i = 0; i < DATA.length; i++){
      const byteIdx = Math.floor(i * 2 / 8);
      if(byteIdx >= bin.length){ out.push(0); continue; }
      const shift = 6 - ((i * 2) % 8);
      out.push((bin.charCodeAt(byteIdx) >> shift) & 3);
    }
    return out;
  }catch(e){ return null; }
}

function importFromHash(){
  const m = location.hash.match(/^#s=([A-Za-z0-9_-]+)$/);
  if(!m) return 0;
  const arr = decodeState(m[1]);
  if(!arr) return 0;
  let n = 0;
  arr.forEach((v, i)=>{
    const q = DATA[i];
    if(!q || !v) return;
    const val = v === 1 ? 1 : 0;
    if(done[q.id] !== val){ done[q.id] = val; n++; }
  });
  if(n) saveDone();
  history.replaceState(null, "", location.pathname + location.search);
  return n;
}

function toast(msg){
  let t = document.getElementById("toast");
  if(!t){
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("on"), 2800);
}

function buildReport(){
  const total = DATA.length;
  const ids = Object.keys(done).filter(id => DATA.some(q=>q.id===id));
  const answered = ids.length;
  const right = ids.filter(i=>done[i]===1).length;
  const wrong = answered - right;
  const rate = answered ? Math.round(right / answered * 100) : 0;
  const pct = (answered / total * 100).toFixed(1);

  let h = `<div class="rgrid">
    <div class="rstat"><b>${total}</b><span>总题数</span></div>
    <div class="rstat"><b>${answered}</b><span>已练习</span></div>
    <div class="rstat"><b>${rate}%</b><span>正确率</span></div>
    <div class="rstat"><b>${wrong}</b><span>待复习</span></div>
  </div>`;

  h += `<div class="rsec"><h3>整体进度</h3>
    <div class="rbar"><i style="width:${pct}%"></i></div>
    <div class="rbar-t">已做 ${answered} / ${total} 题 · ${pct}%</div></div>`;

  h += `<div class="rsec"><h3>各章掌握情况</h3>`;
  MODULES.forEach(m=>{
    const qs = DATA.filter(q=>q.module===m);
    const a = qs.filter(q=>done[q.id]!==undefined).length;
    const r = qs.filter(q=>done[q.id]===1).length;
    const p = qs.length ? Math.round(a / qs.length * 100) : 0;
    const acc = a ? Math.round(r / a * 100) : 0;
    const cls = a ? (acc>=80?"hi":acc>=60?"mid":"lo") : "";
    h += `<div class="rrow"><span class="nm">${m}</span>
      <span class="rb"><i class="${cls}" style="width:${p}%"></i></span>
      <span class="vv">${a}/${qs.length}　${a?acc+"%":"—"}</span></div>`;
  });
  h += `</div>`;

  h += `<div class="rsec"><h3>题型表现</h3>`;
  [["单选题","单选"],["多选题","多选"],["判断题","判断"],["填空","填空"]].forEach(([key,label])=>{
    const qs = DATA.filter(q=>(q.type||"").includes(key));
    if(!qs.length) return;
    const a = qs.filter(q=>done[q.id]!==undefined).length;
    const r = qs.filter(q=>done[q.id]===1).length;
    const acc = a ? Math.round(r / a * 100) : 0;
    const cls = a ? (acc>=80?"hi":acc>=60?"mid":"lo") : "";
    h += `<div class="rrow"><span class="nm">${label}</span>
      <span class="rb"><i class="${cls}" style="width:${a?acc:0}%"></i></span>
      <span class="vv">${a}/${qs.length}　${a?acc+"%":"—"}</span></div>`;
  });
  h += `</div>`;

  const wrongQs = DATA.filter(q=>done[q.id]===0);
  h += `<div class="rsec"><h3>需要复习（${wrongQs.length}）</h3>`;
  if(!wrongQs.length){
    h += `<div class="rempty">暂无错题${answered?"，继续保持。":"，先做几道题吧。"}</div>`;
  } else {
    h += `<ul class="rwrong">` + wrongQs.slice(0,15).map(q=>
      `<li><b>${q.seq}</b>${q.content.length>44 ? q.content.slice(0,44)+"…" : q.content}<em>${q.module}</em></li>`
    ).join("") + `</ul>`;
    if(wrongQs.length > 15) h += `<div class="rempty">另有 ${wrongQs.length-15} 道，可在左侧「错题本」查看。</div>`;
  }
  h += `</div>`;

  document.getElementById("rName").textContent = profile ? profile.name : "本机访客";
  document.getElementById("reportBody").innerHTML = h;
}

function openReport(){
  buildReport();
  document.getElementById("report").classList.add("on");
}

function applyProfile(){
  document.getElementById("who").textContent = profile.name;
  loadDone();
  curIdx = 0;
  render();
}

function askName(prefill){
  const inp = document.getElementById("nameInput");
  inp.value = prefill || "";
  document.getElementById("welcome").classList.add("on");
  setTimeout(()=>inp.focus(), 140);
}

document.getElementById("q").oninput = e=>{ kw = e.target.value.trim(); curIdx = 0; render(); };
document.getElementById("typeSeg").querySelectorAll("button").forEach(b=>{
  b.onclick = ()=>{
    document.getElementById("typeSeg").querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); curType = b.dataset.t; curIdx = 0; render();
  };
});
document.getElementById("toggleAll").onclick = ()=>{
  showAll = !showAll;
  document.getElementById("toggleAll").textContent = showAll ? "收起答案" : "显示答案";
  document.getElementById("toggleAll").classList.toggle("on", showAll);
  render();
};
document.getElementById("shuffleBtn").onclick = ()=>{
  shuffleOn = !shuffleOn;
  const b = document.getElementById("shuffleBtn");
  b.classList.toggle("on", shuffleOn);
  shuffleOrder = null; shuffleKey = "";
  curIdx = 0;
  render();
  window.scrollTo({top:0});
};
document.getElementById("modeBtn").onclick = ()=>{
  mode = (mode === "single") ? "list" : "single";
  document.getElementById("modeBtn").textContent = (mode === "single") ? "列表模式" : "刷题模式";
  render();
  window.scrollTo({top:0});
};
document.getElementById("printBtn").onclick = ()=> window.print();
window.onafterprint = ()=>{
  document.body.classList.remove("printing");
  document.body.classList.remove("printing-report");
};
document.getElementById("reset").onclick = ()=>{
  if(!confirm("清空「" + (profile ? profile.name : "本机") + "」的作答记录？此举不可恢复。")) return;
  done = {}; localStorage.removeItem("ob_done_" + pkey()); render();
};
document.onkeydown = e=>{
  if(mode !== "single") return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if(e.key === "ArrowLeft")  { const b = document.getElementById("prevBtn"); if(b) b.click(); }
  if(e.key === "ArrowRight") { const b = document.getElementById("nextBtn"); if(b) b.click(); }
};
window.onscroll = ()=>{ document.getElementById("totop").style.display = scrollY>500?"flex":"none"; };
document.getElementById("totop").onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});

/* 报告 */
document.getElementById("reportBtn").onclick = openReport;
document.getElementById("reportClose").onclick = ()=> document.getElementById("report").classList.remove("on");
document.getElementById("report").addEventListener("click", e=>{
  if(e.target.id === "report") document.getElementById("report").classList.remove("on");
});
document.getElementById("reportPrint").onclick = ()=>{
  document.body.classList.add("printing-report");
  window.print();
};

/* 使用者 */
document.getElementById("startBtn").onclick = ()=>{
  const name = document.getElementById("nameInput").value.trim();
  if(!name){ document.getElementById("nameInput").focus(); return; }
  profile = { name: name.slice(0,16), key: "u_" + hashKey(name), t: Date.now() };
  localStorage.setItem("ob_profile", JSON.stringify(profile));
  document.getElementById("welcome").classList.remove("on");
  applyProfile();
  if(pendingHash){
    pendingHash = false;
    const n = importFromHash();
    if(n){ render(); setTimeout(()=>toast(`已从链接导入 ${n} 道题的记录`), 300); }
  }
};
document.getElementById("nameInput").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("startBtn").click();
});
document.getElementById("who").onclick = ()=>{
  const cur = profile ? profile.name : "访客";
  if(!confirm(`切换到其他使用者？\n\n「${cur}」的记录会保留，重新输入同一名字即可切回。`)) return;
  localStorage.removeItem("ob_profile");
  profile = null;
  done = {};
  render();
  askName("");
};

/* 同步：当前采用纯本地存储，跨设备同步入口暂不开放。
   若日后接入后端，补回 syncBtn / syncBox 两个节点并填入 SYNC_URL 即可。 */

/* 分享进度 */
document.getElementById("shareBtn").onclick = ()=>{
  const n = Object.keys(done).length;
  if(!n){ toast("还没有做题记录，先做几道吧"); return; }
  const base = (location.protocol === "file:")
    ? location.href.split("#")[0]
    : location.origin + location.pathname;
  const url = base + "#s=" + encodeState();
  document.getElementById("shareInput").value = url;
  document.getElementById("shareTip").textContent = `含 ${n} 道题的记录 · 不含任何个人信息`;
  document.getElementById("shareBox").classList.add("on");
  setTimeout(()=>document.getElementById("shareInput").select(), 160);
};
document.getElementById("shareCopy").onclick = async ()=>{
  const el = document.getElementById("shareInput");
  try{
    await navigator.clipboard.writeText(el.value);
    document.getElementById("shareTip").textContent = "已复制，去另一台设备粘贴打开";
  }catch(e){
    el.select();
    document.getElementById("shareTip").textContent = "复制失败，请手动全选复制";
  }
};
document.getElementById("shareClose").onclick = ()=> document.getElementById("shareBox").classList.remove("on");
document.getElementById("shareBox").addEventListener("click", e=>{
  if(e.target.id === "shareBox") document.getElementById("shareBox").classList.remove("on");
});

/* 启动 */
try{ profile = JSON.parse(localStorage.getItem("ob_profile") || "null"); }catch(e){ profile = null; }
let importedCount = 0;
if(profile && profile.name){
  document.getElementById("who").textContent = profile.name;
  loadDone();
  importedCount = importFromHash();
} else {
  profile = null;
  loadDone();
  pendingHash = location.hash.startsWith("#s=");
  setTimeout(()=>askName(""), 260);
}
render();
if(importedCount) setTimeout(()=>toast(`已从链接导入 ${importedCount} 道题的记录`), 800);
setSyncState();
</script>
